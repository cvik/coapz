name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Zig 0.15.1 cannot read the arm64e-only stubs in macOS SDK 26.4+.
      # Keep the ARM runner and Zig version; select a compatible installed SDK.
      - name: Select compatible macOS SDK
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - run: zig build test
      - run: zig build bench -Doptimize=ReleaseFast
